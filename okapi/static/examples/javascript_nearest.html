<!doctype html>
<html lang='en'>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <title>OKAPI JavaScript Example</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {

                var results = document.getElementById('results');

                // Fill the OKAPI installations select-box with dynamic installation list.

                fetch('https://opencaching.pl/okapi/services/apisrv/installations')
                    .then(function(response) { return response.json(); })
                    .then(function(installations) {
                        var select = document.getElementById('installations');
                        for (var i = 0; i < installations.length; i++) {
                            var option = document.createElement('option');
                            option.value = installations[i].okapi_base_url;
                            option.textContent = installations[i].okapi_base_url;
                            select.appendChild(option);
                        }
                    });

                document.getElementById('get_nearest').addEventListener('click', function() {
                    this.style.display = 'none';
                    results.textContent = "Attempting to access your location...";
                    if (navigator.geolocation)
                    {
                        navigator.geolocation.getCurrentPosition(
                            function(position) {
                                results.textContent = "Location acquired! Search for geocaches...";
                                var params = new URLSearchParams({
                                    'search_method': 'services/caches/search/nearest',
                                    'search_params': '{"center": "' + position.coords.latitude + "|" +
                                        position.coords.longitude + '", "limit": 5}',
                                    'retr_method': 'services/caches/geocaches',
                                    'retr_params': '{"fields": "code|name|url"}',
                                    'wrap': 'false',
                                    'consumer_key': document.getElementById('consumer_key').value
                                });
                                fetch(document.getElementById('installations').value +
                                        'services/caches/shortcuts/search_and_retrieve?' + params)
                                    .then(function(response) {
                                        if (!response.ok)
                                            throw new Error(response.status);
                                        return response.json();
                                    })
                                    .then(function(response) {
                                        var ul = document.createElement('ul');
                                        for (var cache_code in response) {
                                            var cache = response[cache_code];
                                            var a = document.createElement('a');
                                            a.setAttribute('href', cache.url);
                                            a.textContent = cache.name;
                                            var li = document.createElement('li');
                                            li.appendChild(a);
                                            ul.appendChild(li);
                                        }
                                        results.innerHTML = "<p>Nearest geocaches:</p>";
                                        results.appendChild(ul);
                                    })
                                    .catch(function() {
                                        results.textContent = "Error :( Have you entered a valid Consumer Key?";
                                    });
                            },
                            function (error) {
                                results.textContent = "Error :( Message: " + error.message;
                            }
                        );
                    } else {
                        results.textContent = "Your browser does not support geolocation.";
                    }
                });
            });
        </script>
        <style>
            a { color: #008; text-decoration: underline; cursor: pointer; }
        </style>
    </head>
    <body>
        <p>Select OKAPI installation: <select id='installations'></select></p>
        <p>Enter your Consumer Key: <input type='text' id='consumer_key'></p>
        <p><a id='get_nearest'>Click here to view the nearest caches</a></p>
        <div id='results'></div>
    </body>
</html>
